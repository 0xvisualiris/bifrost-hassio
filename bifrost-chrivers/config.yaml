# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Bifrost (chrivers)
version: chrivers-2026-10-20.1
slug: bifrost-chrivers
description: "Bifrost based on chrivers/bifrost with the entertainment fix (old working version). Uses its own state in /config/bifrost-legacy."
url: "https://github.com/0xvisualiris/bifrost/tree/chrivers"
arch:
  - amd64
  - aarch64
init: false

## Map config into container (writable)
map:
  - config:rw

## needed to bind to port 80 and 443
privileged:
  - NET_ADMIN

## needed to access the mac address of the physical interface
host_network: true

## enabling this gives +2 bogus security points
#ingress: true

## might be useful when we have a web ui
# panel_icon: lightbulb-group

## apparmor with home assistant does. not. freaking. work.
## too many hours wasted debugging this..
#
# apparmor: true
apparmor: false
